[package]
name = "herdr-title-rename"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "tmux-style window titles and automatic tab/workspace renaming for Herdr"
license = "MIT"
repository = "https://github.com/acjackman/herdr-title-rename"
readme = "README.md"
keywords = ["herdr", "terminal", "title", "plugin"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
