id = "acjackman.title-rename"
name = "Title & Rename"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "tmux-style window titles (workspace | tab | ~/path) and automatic tab/workspace renaming."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

# Run once when the server starts so the title is right before any event fires.
[[startup]]
command = ["./target/release/herdr-title-rename"]

# Only these event names are honoured in a plugin manifest. `pane.updated` —
# the one that carries directory changes — is accepted by the socket API's
# events.subscribe but NOT here; herdr logs `unknown event` and drops it.
# Verified against 0.7.5 by linking a probe manifest: layout.updated,
# pane.cwd_changed, pane.output_changed, pane.renamed, pane.scroll_changed,
# pane.title_changed, pane.updated, and workspace.metadata_updated are all
# rejected. So a bare `cd` cannot wake this plugin through an event hook;
# refreshes happen on focus and structure changes instead.
[[events]]
on = "pane.focused"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "pane.created"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "pane.closed"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "pane.moved"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "workspace.focused"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "workspace.created"
command = ["./target/release/herdr-title-rename"]

# Renames are how a manual rename is noticed: the label no longer matches what
# the plugin last wrote, so the plugin hands that label back to you.
[[events]]
on = "workspace.renamed"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "tab.focused"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "tab.created"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "tab.renamed"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "pane.exited"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "tab.closed"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "tab.moved"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "workspace.updated"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "workspace.closed"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "workspace.moved"
command = ["./target/release/herdr-title-rename"]

[[events]]
on = "worktree.opened"
command = ["./target/release/herdr-title-rename"]

[[actions]]
id = "refresh"
title = "Refresh title and names"
contexts = ["workspace", "tab", "pane"]
command = ["./target/release/herdr-title-rename"]

[[actions]]
id = "clear"
title = "Clear the window title"
contexts = ["workspace", "tab", "pane"]
command = ["./target/release/herdr-title-rename", "--clear"]
